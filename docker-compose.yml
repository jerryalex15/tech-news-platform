services:
  tech-news-service:
    build:
      context: ./tech-news-service
      dockerfile: Dockerfile
    container_name: news-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - newstech-network

networks:
  newstech-network:
    driver: bridge